<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Celoobrazovkový režim po "Přidat na plochu" (iPad jako meteostanice) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f5f2ec" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0a0a;
      --ink-mid: #3a3a3a;
      --ink-light: #888;
      --ink-faint: #ccc;
      --paper: #f5f2ec;
      --paper-dark: #e8e4db;
      --rule: #d0ccc3;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Spectral', Georgia, serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 18px;
      border-bottom: 1.5px solid var(--ink);
    }

    .time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: -1px;
      line-height: 1;
    }

    .date-line {
      font-size: 0.82rem;
      color: var(--ink-mid);
      font-style: italic;
      margin-top: 4px;
    }

    .header-right {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--ink-light);
      padding-top: 4px;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-mid);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 3px 8px;
      cursor: pointer;
      margin-top: 6px;
      border-radius: 2px;
      display: block;
      margin-left: auto;
    }
    .refresh-btn:hover { background: var(--paper-dark); }

    /* ── SECTIONS ── */
    section {
      padding: 18px 0;
      border-bottom: 1px solid var(--rule);
    }
    section:last-of-type { border-bottom: none; }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 12px;
    }

    /* ── WEATHER ── */
    .weather-main {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 10px;
    }
    .weather-temp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.6rem;
      font-weight: 300;
      line-height: 1;
    }
    .weather-desc { font-size: 1rem; font-style: italic; color: var(--ink-mid); padding-bottom: 4px; }
    .weather-details {
      display: flex; gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; color: var(--ink-mid); flex-wrap: wrap;
    }
    .weather-hours {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem; color: var(--ink-mid); margin-top: 10px;
    }
    .weather-hours b { font-weight: 400; color: var(--ink); font-size: 1.25rem; }
    .weather-forecast { display: flex; margin-top: 12px; }
    .forecast-day {
      flex: 1; text-align: center; padding: 7px 4px;
      border-left: 1px solid var(--rule);
      font-family: 'JetBrains Mono', monospace;
    }
    .forecast-day:first-child { border-left: none; }
    .forecast-name { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-light); }
    .forecast-icon { font-size: 1.1rem; margin: 4px 0; }
    .forecast-temps { font-size: 0.68rem; color: var(--ink-mid); }
    .forecast-high { color: var(--ink); }

    /* ── NETATMO ── */
    .netatmo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .netatmo-module {
      padding: 10px 6px 10px 0;
      border-bottom: 1px solid var(--paper-dark);
    }
    .netatmo-module:nth-last-child(-n+2) { border-bottom: none; }
    .netatmo-module-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-light);
      margin-bottom: 5px;
    }
    .netatmo-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem; font-weight: 300; line-height: 1; margin-bottom: 3px;
    }
    .netatmo-rows { display: flex; flex-direction: column; gap: 2px; }
    .netatmo-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .netatmo-key { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--ink-light); }
    .netatmo-val { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--ink); }
    .netatmo-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }
    .netatmo-updated { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-faint); margin-top: 8px; }
    .noise-graph-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-light);
      margin-bottom: 4px; margin-top: 10px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .noise-graph-range { color: var(--ink); }
    .noise-graph-svg { width: 100%; overflow: visible; display: block; }

    /* ── GROWATT ── */
    .growatt-main { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 12px; }
    .growatt-power { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 300; line-height: 1; }
    .growatt-power-label { font-size: 0.82rem; font-style: italic; color: var(--ink-mid); padding-bottom: 4px; }
    .growatt-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--rule); border: 1px solid var(--rule);
    }
    .growatt-cell { background: var(--paper); padding: 8px 10px; }
    .growatt-cell-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-light); margin-bottom: 3px;
    }
    .growatt-cell-val { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--ink); }
    .growatt-cell-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--ink-light); margin-top: 2px; }
    .battery-bar-wrap { height: 5px; background: var(--paper-dark); border-radius: 1px; margin-top: 5px; overflow: hidden; }
    .battery-bar-fill { height: 100%; background: var(--ink-mid); border-radius: 1px; }
    .direction-badge {
      display: inline-block; font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem; padding: 1px 5px; border: 1px solid var(--rule);
      border-radius: 2px; color: var(--ink-mid); margin-left: 4px;
    }
    .growatt-updated { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-faint); margin-top: 8px; }
    .growatt-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }

    /* ── CALENDAR ── */
    .event-list { display: flex; flex-direction: column; gap: 5px; }
    .event-item { display: flex; gap: 10px; align-items: baseline; }
    .event-time { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--ink-light); min-width: 72px; flex-shrink: 0; }
    .event-dot { width: 4px; height: 4px; background: var(--ink); border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
    .event-title { font-size: 0.92rem; line-height: 1.35; }
    .cal-group-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin: 10px 0 5px; }
    .cal-group-label:first-child { margin-top: 0; }
    .ics-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--ink-light); font-style: italic; margin-top: 6px; }

    /* ── TASKS ── */
    .task-list { display: flex; flex-direction: column; gap: 1px; }
    .task-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--paper-dark); }
    .task-item:last-child { border-bottom: none; }
    .task-check { width: 14px; height: 14px; border: 1.5px solid var(--ink-mid); border-radius: 1px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .task-item.done .task-check::after { content: '×'; font-size: 12px; color: var(--ink-mid); }
    .task-text { font-size: 0.9rem; line-height: 1.4; }
    .task-item.done .task-text { color: var(--ink-light); text-decoration: line-through; }
    .task-manage-link { display: inline-block; margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; color: var(--ink-light); text-decoration: none; border-bottom: 1px solid var(--rule); }
    .task-manage-link:hover { color: var(--ink-mid); }
    .empty-note { font-style: italic; font-size: 0.85rem; color: var(--ink-light); }

    /* ── TUYA BRÁNA ── */
    .gate-row { display: flex; align-items: center; gap: 14px; }
    .gate-indicator {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--rule);
    }
    .gate-indicator.open    { background: #c0392b; border-color: #c0392b; }
    .gate-indicator.closed  { background: #27ae60; border-color: #27ae60; }
    .gate-indicator.unknown { background: var(--paper-dark); }
    .gate-status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem; font-weight: 300; line-height: 1;
    }
    .gate-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--ink-light); margin-top: 8px; }
    .gate-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }
    .gate-dps { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
    .gate-dp-row { display: flex; justify-content: space-between; gap: 8px; }
    .gate-dp-key { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--ink-light); }
    .gate-dp-val { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--ink); }

    /* ── JÍDELNÍČEK MŠ ── */
    .menu-day-label { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.06em; color: var(--ink-mid); margin-bottom: 8px; }
    .menu-week { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-light); margin-bottom: 10px; }
    .menu-meals { display: flex; flex-direction: column; gap: 4px; }
    .menu-meal { font-size: 0.9rem; line-height: 1.45; padding-left: 10px; border-left: 2px solid var(--rule); }
    .menu-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }

    /* ── KALENDÁŘ ZŠ ── */
    .zs-cal-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }
    .zs-cal-list { display: flex; flex-direction: column; gap: 5px; }
    .zs-cal-item { display: flex; gap: 10px; align-items: baseline; }
    .zs-cal-date { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--ink-light); min-width: 80px; flex-shrink: 0; }
    .zs-cal-title { font-size: 0.92rem; line-height: 1.35; }
    .zs-cal-title a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
    .zs-cal-title a:hover { border-bottom-color: var(--ink-mid); }

    /* ── MICROSOFT TO DO ── */
    .mstodo-notice { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); font-style: italic; }
    .mstodo-list { display: flex; flex-direction: column; gap: 1px; }
    .mstodo-item { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--paper-dark); }
    .mstodo-item:last-child { border-bottom: none; }
    .mstodo-check { width: 14px; height: 14px; border: 1.5px solid var(--ink-mid); border-radius: 50%; flex-shrink: 0; margin-top: 1px; }
    .mstodo-item.important .mstodo-check { border-color: #c0392b; }
    .mstodo-text { font-size: 0.9rem; line-height: 1.4; flex: 1; }
    .mstodo-item.important .mstodo-text { color: var(--ink); }
    .mstodo-due { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--ink-light); flex-shrink: 0; }
    .mstodo-due.overdue { color: #c0392b; }
    .mstodo-list-name { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 0.08em; color: var(--ink-faint); flex-shrink: 0; }
    .mstodo-group-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin: 10px 0 5px; }
    .mstodo-group-label:first-child { margin-top: 0; }
    .mstodo-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .mstodo-disconnect { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; padding: 1px 6px; border: 1px solid var(--rule); background: none; color: var(--ink-light); cursor: pointer; }

    /* ── FOOTER ── */
    .footer { padding-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-faint); display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <div class="time" id="clock">--:--</div>
      <div class="date-line" id="date-line">načítám…</div>
    </div>
    <div class="header-right">
      <div id="last-update">–</div>
      <button class="refresh-btn" onclick="initAll()">↺ obnovit</button>
    </div>
  </header>

  <section>
    <div class="section-label">Počasí · Vranov u Brna</div>
    <div class="weather-main">
      <div class="weather-temp" id="w-temp">–</div>
      <div class="weather-desc" id="w-desc">načítám…</div>
    </div>
    <div class="weather-details">
      <span id="w-wind">💨 –</span>
      <span id="w-humid">💧 –</span>
      <span id="w-rain">🌧 –</span>
    </div>
    <div class="weather-hours" id="w-hours"></div>
    <div class="weather-hours" id="w-rain-hours"></div>
    <div class="weather-forecast" id="w-forecast"></div>
  </section>

  <section>
    <div class="section-label">Netatmo stanice</div>
    <div id="netatmo-content"><div class="netatmo-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Tuya senzory</div>
    <div id="tuya-content"><div class="gate-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Solární systém · Growatt</div>
    <div id="growatt-content"><div class="growatt-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Kalendář</div>
    <div id="cal-content"></div>
    <div class="ics-notice" id="ics-notice"></div>
  </section>

  <section>
    <div class="section-label">Microsoft To Do</div>
    <div id="mstodo-content"><div class="mstodo-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Jídelníček MŠ · Vranov</div>
    <div id="menu-content"><div class="menu-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Plán akcí ZŠ</div>
    <div id="zs-cal-content"><div class="zs-cal-notice">načítám…</div></div>
  </section>

  <section>
    <div class="section-label">Úkoly</div>
    <div class="task-list" id="task-list"><div class="empty-note">žádné úkoly</div></div>
    <a href="tasks.html" class="task-manage-link">→ spravovat úkoly</a>
  </section>

  <footer class="footer">
    <span>Vranov u Brna</span>
    <span id="footer-date">–</span>
  </footer>

<script>
// ════════════════════════════════════════════════════════
//  KONFIGURACE
// ════════════════════════════════════════════════════════

// --- Netatmo ---
// Data stahuje GitHub Actions (scripts/fetch_netatmo.py) – credentials jsou
// v GitHub Secrets (NETATMO_*), nic citlivého není v tomto souboru.
// Postup nastavení viz docstring scripts/fetch_netatmo.py.

// --- Data generovaná GitHub Actions ---
// Workflows publikují JSON do větve "data", aby botí commity nezaplavovaly
// historii main. Při nedostupnosti se použije lokální ./data/ (seed v main).
// Na GitHub Pages (*.github.io) se data čtou z veřejné větve "data" (raw).
// Na Cloudflare (vlastní doména) ze same-origin Pages Function /api/data/ —
// data jsou pak privátní za Cloudflare Access. Viz CLOUDFLARE.md.
const DATA_BRANCH_BASE = location.hostname.endsWith('github.io')
  ? 'https://raw.githubusercontent.com/MichalProuza/home_dashboard/data/'
  : '/api/data/';
const GROWATT_JSON_URL     = 'growatt.json';
const TUYA_JSON_URL        = 'tuya.json';
const CALENDAR_JSON_URL    = 'calendar.json';
const SCHOOL_MENU_URL      = 'school_menu.json';
const ZS_CALENDAR_JSON_URL = 'school_calendar.json';
const NETATMO_JSON_URL     = 'netatmo.json';
const WEATHER_JSON_URL     = 'weather.json';

// --- Microsoft To Do ---
// 1. Jdi na https://portal.azure.com → "Registrace aplikací" → "Nová registrace"
// 2. Název: libovolný (např. "Home Dashboard")
// 3. Podporované typy účtů: "Osobní účty Microsoft" (nebo "Všechny typy")
// 4. Identifikátor URI pro přesměrování: typ "Jednostránková aplikace (SPA)", URL tohoto dashboardu
//    (např. https://uzivatel.github.io/home_dashboard/)
// 5. Na stránce přehledu aplikace zkopíruj "ID aplikace (klienta)"
const MSTODO_CLIENT_ID = '8b6821fc-8ef4-4c4f-b825-eef8255766d5';
const MSTODO_TENANT    = 'consumers'; // 'consumers' = jen osobní MS účty; 'common' = personal + work

// --- Poloha pro Open-Meteo ---
const LAT = 49.043, LON = 16.558;   // Vranov u Brna

// ════════════════════════════════════════════════════════
//  SPOLEČNÉ POMOCNÉ FUNKCE
// ════════════════════════════════════════════════════════

// Escapování externích textů před vložením do innerHTML
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

// fetch s timeoutem, vypnutou cache a kontrolou HTTP stavu
function fetchTimeout(ms) {
  return (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;
}
async function fetchJson(url, opts = {}) {
  const res = await fetch(url, { cache: 'no-store', signal: fetchTimeout(15000), ...opts });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// JSON generovaný workflows: primárně z větve "data", fallback lokální ./data/
async function fetchDataJson(name) {
  try {
    return await fetchJson(`${DATA_BRANCH_BASE}${name}?t=${Date.now()}`);
  } catch (e) {
    return fetchJson(`./data/${name}?t=${Date.now()}`);
  }
}

// ════════════════════════════════════════════════════════
//  HODINY
// ════════════════════════════════════════════════════════
const CZ_DAYS   = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const CZ_MONTHS = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const clockEl      = document.getElementById('clock');
const dateLineEl   = document.getElementById('date-line');
const footerDateEl = document.getElementById('footer-date');
let _lastClockStr = '', _lastDateStr = '';

function updateClock() {
  const now = new Date();
  const clockStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if (clockStr !== _lastClockStr) {
    _lastClockStr = clockStr;
    clockEl.textContent = clockStr;
  }
  const dateStr = `${CZ_DAYS[now.getDay()]}, ${now.getDate()}. ${CZ_MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  if (dateStr !== _lastDateStr) {
    _lastDateStr = dateStr;
    dateLineEl.textContent = dateStr;
    footerDateEl.textContent = `${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`;
  }
}
setInterval(updateClock, 1000);
updateClock();

// ════════════════════════════════════════════════════════

// Předpověď na 10:00 a 14:00 — do 14:00 pro dnešek, po 14:01 pro zítřek
function renderHoursForecast(hourly) {
  if (!hourly?.time || !hourly?.temperature_2m) return '';
  const now = new Date();
  const tomorrow = now.getHours() * 60 + now.getMinutes() >= 14 * 60 + 1;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (tomorrow ? 1 : 0));
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const tempAt = hh => {
    const idx = hourly.time.indexOf(`${ymd}T${hh}:00`);
    return idx === -1 ? null : hourly.temperature_2m[idx];
  };
  const t10 = tempAt('10'), t14 = tempAt('14');
  if (t10 === null && t14 === null) return '';
  return (tomorrow ? 'Zítra' : 'Dnes')
    + (t10 !== null ? ` · 10:00 <b>${Math.round(t10)}°</b>` : '')
    + (t14 !== null ? ` · 14:00 <b>${Math.round(t14)}°</b>` : '');
}

// Předpokládané srážky za dalších 8 a 24 h (součet hodinové předpovědi od aktuální hodiny)
function renderRainForecast(hourly) {
  if (!hourly?.time || !hourly?.precipitation) return '';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const idx = hourly.time.indexOf(`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:00`);
  if (idx === -1) return '';
  const sum = n => hourly.precipitation.slice(idx, idx + n).reduce((a, b) => a + (Number(b) || 0), 0);
  return `Srážky · 8h <b>${sum(8).toFixed(1)} mm</b> · 24h <b>${sum(24).toFixed(1)} mm</b>`;
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      +`&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,precipitation`
      +`&daily=weather_code,temperature_2m_max,temperature_2m_min&hourly=temperature_2m,precipitation`
      +`&timezone=Europe%2FPrague&forecast_days=5`;
    let c, d, h;
    try {
      // Přímý dotaz — nejčerstvější data
      ({current: c, daily: d, hourly: h} = await fetchJson(url));
    } catch (e) {
      // Open-Meteo blokuje některé IP rozsahy → záloha z workflow (větev data)
      const w = await fetchDataJson(WEATHER_JSON_URL);
      if (!w.current || !w.daily) throw new Error(w.error || 'weather.json bez dat');
      c = w.current; d = w.daily; h = w.hourly;

    document.getElementById('w-hours').innerHTML = renderHoursForecast(h);
    document.getElementById('w-rain-hours').innerHTML = renderRainForecast(h);
    document.getElementById('w-temp').textContent = `${Math.round(c.temperature_2m)}°C`;
    document.getElementById('w-desc').textContent = WMO[c.weather_code]||'–';
    document.getElementById('w-wind').textContent = `💨 ${Math.round(c.wind_speed_10m)} km/h`;
    document.getElementById('w-humid').textContent = `💧 ${c.relative_humidity_2m}%`;
    document.getElementById('w-rain').textContent = `🌧 ${c.precipitation} mm`;
    const dayN=['Ne','Po','Út','St','Čt','Pá','So'];
    document.getElementById('w-forecast').innerHTML = d.time.slice(0,5).map((t,i)=>{
      const dn=new Date(t), name=i===0?'Dnes':i===1?'Zítra':dayN[dn.getDay()];
      return `<div class="forecast-day"><div class="forecast-name">${name}</div><div class="forecast-icon">${WMO_ICON[d.weather_code[i]]||'–'}</div><div class="forecast-temps"><span class="forecast-high">${Math.round(d.temperature_2m_max[i])}°</span><span style="color:var(--ink-light)"> / ${Math.round(d.temperature_2m_min[i])}°</span></div></div>`;
    }).join('');
  } catch(e) { document.getElementById('w-desc').textContent='chyba načítání'; }
}

const NLABELS = {Temperature:'Teplota',Humidity:'Vlhkost',CO2:'CO₂',Noise:'Hluk',Pressure:'Tlak',AbsolutePressure:'Abs. tlak',Rain:'Déšť',sum_rain_1:'Déšť/h',sum_rain_8:'Déšť/8h',sum_rain_24:'Déšť/24h',WindStrength:'Vítr',WindAngle:'Směr',GustStrength:'Nárazy',GustAngle:'Sm. nárazu'};

function fmtN(k,v) {
  const n = Number(v);
  const f1 = isNaN(n) ? v : n.toFixed(1);
  const r  = isNaN(n) ? v : Math.round(n);
  const map = {
    Temperature:`${f1} °C`, Humidity:`${r} %`, CO2:`${r} ppm`, Noise:`${r} dB`,
    Pressure:`${f1} hPa`, AbsolutePressure:`${f1} hPa`,
    Rain:`${f1} mm`, sum_rain_1:`${f1} mm/h`, sum_rain_8:`${f1} mm/8h`, sum_rain_24:`${f1} mm/24h`,
    WindStrength:`${r} km/h`, WindAngle:`${r}°`, GustStrength:`${r} km/h`, GustAngle:`${r}°`
  };
  return map[k] ?? String(v);
}

// Sdílený 24h graf (hluk Netatmo, SOC baterie Growatt) — body [{t: unix, v: hodnota}]
function renderHistoryGraph(points, label, unit) {
  if (points.length < 2) return '';
  const W = 400, H = 48;
  const vals = points.map(p => p.v);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const tMin = points[0].t, tMax = points[points.length - 1].t;
  const tRange = tMax - tMin || 1;
  const px = t => ((t - tMin) / tRange) * W;
  const py = v => H - 2 - ((v - minV) / range) * (H - 6);
  const linePath = points.map((p, i) =>
    `${i === 0 ? 'M' : 'L'} ${px(p.t).toFixed(1)} ${py(p.v).toFixed(1)}`
  ).join(' ');
  const areaPath = `${linePath} L ${px(tMax).toFixed(1)} ${H} L ${px(tMin).toFixed(1)} ${H} Z`;
  const labels = [];
  const step6h = 6 * 3600;
  const firstLabel = Math.ceil(tMin / step6h) * step6h;
  for (let t = firstLabel; t <= tMax; t += step6h) {
    const lx = px(t);
    const d = new Date(t * 1000);
    const hh = String(d.getHours()).padStart(2, '0');
    labels.push(`<text x="${lx.toFixed(1)}" y="${H + 12}" font-size="8" fill="var(--ink-faint)" text-anchor="middle" font-family="JetBrains Mono, monospace">${hh}:00</text>`);
  }
  return `<div>
    <div class="noise-graph-label">${label}<span class="noise-graph-range">${Math.round(minV)}–${Math.round(maxV)} ${unit}</span></div>
    <svg viewBox="0 0 ${W} ${H + 16}" class="noise-graph-svg">
      <path d="${areaPath}" fill="var(--paper-dark)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="var(--ink-mid)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${labels.join('')}
    </svg>
  </div>`;
}

async function fetchNetatmo() {
  const el = document.getElementById('netatmo-content');
  try {
    const data = await fetchDataJson(NETATMO_JSON_URL);
    if (data.error) { el.innerHTML=`<div class="netatmo-notice">${esc(data.error)}</div>`; return; }

    const modules = data.modules || [];
    if (!modules.length) { el.innerHTML='<div class="netatmo-notice">Žádná Netatmo zařízení.</div>'; return; }

    const skip = new Set(['time_utc','date_max_temp','date_min_temp','min_temp','max_temp','Temperature']);
    let html='<div class="netatmo-grid">';
    for (const mod of modules) {
      const dd = mod.data || {};
      html += `<div class="netatmo-module">
        <div class="netatmo-module-name">${esc(mod.name)}</div>`;
      if (dd.Temperature !== undefined)
        html += `<div class="netatmo-big">${Number(dd.Temperature).toFixed(1)}°C</div>`;
      html += '<div class="netatmo-rows">';
      for (const [k,v] of Object.entries(dd)) {
        if (skip.has(k) || v===null || v===undefined) continue;
        html += `<div class="netatmo-row"><span class="netatmo-key">${esc(NLABELS[k]||k)}</span><span class="netatmo-val">${esc(fmtN(k,v))}</span></div>`;
      }
      html += '</div></div>';
    }
    html += '</div>';

    // Graf hluku za posledních 24 h
    if (data.noise?.length) html += renderHistoryGraph(data.noise, 'Hluk / 24h', 'dB');

    const upd = data.updated
      ? new Date(data.updated).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})
      : '–';
    html += `<div class="netatmo-updated">data z ${upd}</div>`;

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML='<div class="netatmo-notice">data/netatmo.json nenalezen – nastav NETATMO_* secrets a spusť workflow.</div>';
  }
}

async function fetchCalendar() {
  const content=document.getElementById('cal-content');
  const notice=document.getElementById('ics-notice');
  const dayN=['Ne','Po','Út','St','Čt','Pá','So'];
  function renderEvents(evs) {
    if (!evs.length) return '<span style="color:var(--ink-light);font-size:0.85rem;font-style:italic;">–</span>';
    return evs.map(e=>{
      const d=new Date(e.date);
      const p=n=>String(n).padStart(2,'0');
      const t=e.all_day?`${dayN[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`:`${dayN[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}. ${p(d.getHours())}:${p(d.getMinutes())}`;
      return `<div class="event-item"><div class="event-dot"></div><div class="event-time">${t}</div><div class="event-title">${esc(e.summary)}</div></div>`;
    }).join('');
  }
  try {
    const data=await fetchDataJson(CALENDAR_JSON_URL);
    if (data.error) { notice.textContent=`Chyba kalendáře: ${data.error}`; return; }
    const recurring=data.recurring||[];
    const single=data.single||[];
    if (!recurring.length && !single.length) { content.innerHTML='<span style="color:var(--ink-light);font-size:0.85rem;font-style:italic;">Žádné nadcházející události.</span>'; return; }
    content.innerHTML=
      `<div class="cal-group-label">Opakující se</div><div class="event-list">${renderEvents(recurring)}</div>`+
      `<div class="cal-group-label">Jednorázové</div><div class="event-list">${renderEvents(single)}</div>`;
    if (data.updated) notice.textContent=`Aktualizováno: ${new Date(data.updated).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}`;
  } catch(e) { notice.textContent=`Chyba kalendáře: ${e.message}`; }
}

// --- PKCE helpers ---
function _b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function msTodoGenerateVerifier() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return _b64url(arr.buffer);
}
async function msTodoGenerateChallenge(verifier) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return _b64url(hash);
}

// --- Zpracování OAuth callbacku ---
async function handleMsTodoCallback() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('state') !== 'mstodo') return;
  history.replaceState({}, '', window.location.pathname);

  if (params.get('error')) {
    console.warn('MS Todo OAuth chyba:', params.get('error_description'));
    return;
  }
  const code = params.get('code');
  if (!code) return;

  const verifier = localStorage.getItem('mstodo_code_verifier');
  if (!verifier) return;

  try {
    const body = new URLSearchParams({
      client_id: MSTODO_CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: location.origin + location.pathname,
      code_verifier: verifier,
      scope: 'Tasks.Read offline_access',
    });
    const data = await (await fetch(
      `https://login.microsoftonline.com/${MSTODO_TENANT}/oauth2/v2.0/token`,
      { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body }
    )).json();
    if (data.access_token) {
      localStorage.setItem('mstodo_access_token', data.access_token);
      if (data.refresh_token)
        localStorage.setItem('mstodo_refresh_token', data.refresh_token);
      localStorage.setItem('mstodo_expires_at', Date.now() + data.expires_in * 1000);
    }
  } catch(e) {}
  localStorage.removeItem('mstodo_code_verifier');
}

// --- Obnovení tokenu ---
function clearMsTodoTokens() {
  ['mstodo_access_token','mstodo_refresh_token','mstodo_expires_at','mstodo_code_verifier']
    .forEach(k => localStorage.removeItem(k));
}

async function _refreshMsTodoToken(refreshToken) {
  let data;
  try {
    const body = new URLSearchParams({
      client_id: MSTODO_CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refreshToken,
      scope: 'Tasks.Read offline_access',
    });
    data = await (await fetch(
      `https://login.microsoftonline.com/${MSTODO_TENANT}/oauth2/v2.0/token`,
      { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body }
    )).json();
  } catch(e) {
    // Síťová chyba – tokeny ponecháme, obnova se zkusí při příštím refreshi
    return null;
  }
  if (data.access_token) {
    localStorage.setItem('mstodo_access_token', data.access_token);
    if (data.refresh_token)
      localStorage.setItem('mstodo_refresh_token', data.refresh_token);
    localStorage.setItem('mstodo_expires_at', Date.now() + data.expires_in * 1000);
    return data.access_token;
  }
  // Server refresh token odmítl → je neplatný, smažeme ho
  clearMsTodoTokens();
  return null;
}

async function getMsTodoToken() {
  const exp = parseInt(localStorage.getItem('mstodo_expires_at')||'0');
  const tok = localStorage.getItem('mstodo_access_token');
  if (tok && Date.now() < exp - 60000) return tok;
  const ref = localStorage.getItem('mstodo_refresh_token');
  if (ref) return await _refreshMsTodoToken(ref);
  return null;
}

// --- Přihlášení / odhlášení ---
async function authorizeMsTodo() {
  const verifier = msTodoGenerateVerifier();
  const challenge = await msTodoGenerateChallenge(verifier);
  localStorage.setItem('mstodo_code_verifier', verifier);
  const params = new URLSearchParams({
    client_id: MSTODO_CLIENT_ID,
    response_type: 'code',
    redirect_uri: location.origin + location.pathname,
    scope: 'Tasks.Read offline_access',
    state: 'mstodo',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    response_mode: 'query',
  });
  window.location.href =
    `https://login.microsoftonline.com/${MSTODO_TENANT}/oauth2/v2.0/authorize?${params}`;
}

function disconnectMsTodo() {
  clearMsTodoTokens();
  fetchMsTodo();
}

// --- Načtení a vykreslení úkolů ---
async function fetchMsTodo() {
  const el = document.getElementById('mstodo-content');

  const token = await getMsTodoToken();
  if (!token) {
    el.innerHTML = MSTODO_CLIENT_ID
      ? `<div class="mstodo-notice">Microsoft To Do není připojeno.
           <button onclick="authorizeMsTodo()"
             style="font-family:inherit;font-size:0.65rem;padding:2px 8px;border:1px solid var(--rule);background:none;cursor:pointer;margin-left:4px;">
             Připojit →
           </button></div>`
      : `<div class="mstodo-notice">Nastav MSTODO_CLIENT_ID v kódu (Azure portál).</div>`;
    return;
  }

  try {
    // Načti všechny seznamy úkolů
    const { value: lists } = await fetchJson('https://graph.microsoft.com/v1.0/me/todo/lists', {
      headers: { Authorization: `Bearer ${token}` }
    });

    const vranovList = lists?.find(l => l.displayName === 'Vranov');
    if (!vranovList) {
      el.innerHTML = '<div class="mstodo-notice">Seznam „Vranov" nenalezen.</div>'; return;
    }

    // Načti nedokončené úkoly ze seznamu Vranov
    const url = `https://graph.microsoft.com/v1.0/me/todo/lists/${vranovList.id}/tasks`
      + `?$filter=status ne 'completed'`
      + `&$orderby=importance desc,createdDateTime asc`
      + `&$top=50`;
    const { value: rawTasks } = await fetchJson(url, { headers: { Authorization: `Bearer ${token}` } });

    // Zobraz jen úkoly s deadlinem
    const today = new Date(); today.setHours(0,0,0,0);
    const tasks = (rawTasks || [])
      .filter(t => t.dueDateTime?.dateTime)
      .sort((a, b) => new Date(a.dueDateTime.dateTime) - new Date(b.dueDateTime.dateTime));

    if (!tasks.length) {
      el.innerHTML = '<div class="mstodo-notice">Žádné úkoly s termínem.</div>'; return;
    }

    function renderItem(task) {
      const d = new Date(task.dueDateTime.dateTime);
      const isOverdue = d < today;
      const dueStr = d.toLocaleDateString('cs-CZ', { day:'numeric', month:'numeric' });
      const dueClass = 'mstodo-due' + (isOverdue ? ' overdue' : '');
      const imp = task.importance === 'high' ? ' important' : '';
      return `<div class="mstodo-item${imp}">
        <div class="mstodo-check"></div>
        <div class="mstodo-text">${esc(task.title)}</div>
        <span class="${dueClass}">${dueStr}</span>
      </div>`;
    }

    let html = `<div class="mstodo-list">${tasks.map(renderItem).join('')}</div>`;
    html += `<div class="mstodo-footer">
      <span></span>
      <button class="mstodo-disconnect" onclick="disconnectMsTodo()">odpojit</button>
    </div>`;

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="mstodo-notice">Chyba: ${esc(e.message)}</div>`;
  }
}

// ════════════════════════════════════════════════════════
//  PLÁN AKCÍ ZŠ  (čte school_calendar.json z větve data)
// ════════════════════════════════════════════════════════
async function fetchZsCalendar() {
  const el = document.getElementById('zs-cal-content');
  const dayN = ['Ne','Po','Út','St','Čt','Pá','So'];
  try {
    const data = await fetchDataJson(ZS_CALENDAR_JSON_URL);

    const events = data.events || [];

    if (data.error && !events.length) {
      el.innerHTML = '<div class="zs-cal-notice">Akce ZŠ se nepodařilo načíst – zkus znovu později.</div>';
      return;
    }

    if (!events.length) {
      el.innerHTML = '<div class="zs-cal-notice">Žádné nadcházející akce.</div>';
      return;
    }

    const items = events.map(ev => {
      const d = new Date(ev.date + 'T12:00:00');
      const dayLabel = `${dayN[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
      const timeStr = ev.time ? ` ${esc(ev.time)}` : '';
      const titleHtml = ev.url
        ? `<a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.title)}</a>`
        : esc(ev.title);
      return `<div class="zs-cal-item">` +
        `<div class="zs-cal-date">${dayLabel}${timeStr}</div>` +
        `<div class="zs-cal-title">${titleHtml}</div>` +
        `</div>`;
    }).join('');

    const staleNote = data.error
      ? '<div class="zs-cal-notice" style="margin-bottom:6px">⚠ data se nepodařilo obnovit, zobrazuji poslední známé akce</div>'
      : '';
    el.innerHTML = `${staleNote}<div class="zs-cal-list">${items}</div>`;

  } catch(e) {
    el.innerHTML = '<div class="zs-cal-notice">data/school_calendar.json nenalezen – spusť workflow.</div>';
  }
}

// ════════════════════════════════════════════════════════
//  JÍDELNÍČEK MŠ  (čte school_menu.json z větve data)
// ════════════════════════════════════════════════════════
// Sob(6), Ne(0), Po(1) → pondeli; Út(2) → utery; St(3) → streda; Čt(4) → ctvrtek; Pá(5) → patek
const MENU_DAY_MAP = { 0:'pondeli', 1:'pondeli', 2:'utery', 3:'streda', 4:'ctvrtek', 5:'patek', 6:'pondeli' };
const MENU_DAY_FULL = { pondeli:'Pondělí', utery:'Úterý', streda:'Středa', ctvrtek:'Čtvrtek', patek:'Pátek' };

function renderMenuDay(dayKey, data) {
  return `
    <div class="menu-day-label">${MENU_DAY_FULL[dayKey]}</div>
    <div class="menu-week">${esc(data.week||'')}</div>
    <div class="menu-meals">${data.days[dayKey].meals.map(m=>`<div class="menu-meal">${esc(m)}</div>`).join('')}</div>`;
}

async function fetchSchoolMenu() {
  const el = document.getElementById('menu-content');
  try {
    const data = await fetchDataJson(SCHOOL_MENU_URL);

    if (data.error) { el.innerHTML=`<div class="menu-notice">Jídelníček se nepodařilo načíst – zkus znovu později.</div>`; return; }

    const dayKey  = MENU_DAY_MAP[new Date().getDay()];

    if (data.days?.[dayKey]?.meals?.length) {
      el.innerHTML = renderMenuDay(dayKey, data);
      return;
    }

    // Dnešní den nemá jídla – zkus zobrazit nejbližší dostupný den v týdnu
    const dayOrder = ['pondeli','utery','streda','ctvrtek','patek'];
    const todayIdx = dayOrder.indexOf(dayKey);
    const fallbackKey = dayOrder.slice(todayIdx + 1).find(k => data.days?.[k]?.meals?.length);

    if (fallbackKey) {
      el.innerHTML = renderMenuDay(fallbackKey, data);
      return;
    }

    el.innerHTML=`<div class="menu-notice">Jídelníček pro tento týden zatím není k dispozici${data.week ? ' ('+esc(data.week)+')' : ''}.</div>`;

  } catch(e) {
    el.innerHTML='<div class="menu-notice">data/school_menu.json nenalezen – spusť workflow.</div>';
  }
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
const REFRESH_MS = 15*60*1000;
let _refreshing = false;
let _lastRefreshTs = 0;

async function initAll() {
  if (_refreshing) return;
  _refreshing = true;
  const lastUpdateEl = document.getElementById('last-update');
  lastUpdateEl.textContent='aktualizuji…';
  try {
    await handleMsTodoCallback();
    await Promise.allSettled([fetchWeather(), fetchNetatmo(), fetchTuya(), fetchGrowatt(), fetchCalendar(), fetchMsTodo(), fetchSchoolMenu(), fetchZsCalendar()]);
    renderTasks();
  } finally {
    _refreshing = false;
    _lastRefreshTs = Date.now();
    const now=new Date();
    lastUpdateEl.textContent=
      `↺ ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
}

// Po návratu na záložku / probuzení displeje obnov zastaralá data
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - _lastRefreshTs > 5*60*1000) initAll();
});

initAll();
setInterval(initAll, REFRESH_MS);
</script>
