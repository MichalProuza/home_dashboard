<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Celoobrazovkový režim po "Přidat na plochu" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f5f2ec" />
  <title>Dashboard — kiosk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Kiosk verze pro staré prohlížeče (iPad Air 1 / Safari 12):
       žádný optional chaining, žádný flex gap, vše ES2017.
       Layout je zamčený na výšku obrazovky — vše nad foldem, bez scrollování:
       písmo se škáluje přes vmin, obsah teče do sloupců (3 na šířku, 2 na výšku). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0a0a;
      --ink-mid: #3a3a3a;
      --ink-light: #888;
      --ink-faint: #ccc;
      --paper: #f5f2ec;
      --paper-dark: #e8e4db;
      --rule: #d0ccc3;
    }

    html { font-size: 2vmin; height: 100%; }
    body {
      font-family: 'Spectral', serif;
      background: var(--paper);
      color: var(--ink);
      height: 100%;
      overflow: hidden;
      padding: 1.4vmin 1.8vmin;
      -webkit-font-smoothing: antialiased;
    }
    /* Noční režim 22–6 h: tmavý papír + světlé písmo (čitelné, málo svítí).
       Pouhé ztmavení filtrem bylo nečitelné. */
    body.night {
      --ink: #c9c5bc;
      --ink-mid: #a39f96;
      --ink-light: #716e67;
      --ink-faint: #4b4944;
      --paper: #0e0d0c;
      --paper-dark: #1d1c19;
      --rule: #2f2d29;
      background: #0e0d0c;
    }

    /* Horní lišta: výrazné hodiny + datum na jednom řádku */
    .topbar { display: table; width: 100%; border-bottom: 3px solid var(--ink); padding-bottom: 1vmin; }
    #clock {
      display: table-cell;
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.4rem; font-weight: 500; letter-spacing: 0.02em; line-height: 1;
      white-space: nowrap; width: 1%;
      font-variant-numeric: tabular-nums;
    }
    #datum {
      display: table-cell; vertical-align: bottom; text-align: right;
      font-style: italic; color: var(--ink-mid); font-size: 1.3rem;
    }

    /* Pevná mřížka přes celou obrazovku — každá sekce má své místo
       a vyplní celou buňku (Safari 12 umí grid-template-areas i grid-gap) */
    main {
      margin-top: 1.4vmin;
      height: calc(100% - 10vmin);
      display: grid;
      grid-gap: 2.4vmin;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "weather netatmo growatt"
        "cal     mid     zs";
    }
    @media (orientation: portrait) {
      main {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        grid-template-areas:
          "weather netatmo"
          "growatt cal"
          "mid     zs";
      }
    }
    .area-weather { grid-area: weather; }
    .area-netatmo { grid-area: netatmo; }
    .area-growatt { grid-area: growatt; }
    .area-cal     { grid-area: cal; }
    .area-zs      { grid-area: zs; }
    .cell-stack   { display: flex; flex-direction: column; overflow: hidden; }
    .cell-stack section:first-child { flex: 1 1 auto; margin-bottom: 1.6vmin; }
    .area-mid     { grid-area: mid; }

    section {
      display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
    }
    .content { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    /* Nadpis sekce = plný inkoustový pruh (v nočním režimu se přes proměnné sám invertuje) */
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--paper); background: var(--ink);
      padding: 0.55vmin 0.9vmin; margin-bottom: 1vmin;
    }
    .notice { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--ink-light); font-style: italic; }
    /* "data z HH:MM" se drží u spodního okraje buňky */
    .updated { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-faint); margin-top: auto; padding-top: 0.6vmin; }

    /* Počasí — trojice dominantních teplot: teď / 10:00 / 14:00 */
    .w-trio { display: table; width: 100%; table-layout: fixed; margin-bottom: 0.9vmin; }
    .w-cell { display: table-cell; text-align: center; vertical-align: bottom; }
    .w-cell:first-child { text-align: left; }
    .w-cell-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--ink-light); margin-bottom: 0.4vmin;
    }
    .w-cell-temp { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
    .w-cell-temp.now { font-size: 3rem; }
    .w-cond { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--ink-mid); margin-bottom: 0.9vmin; }
    .forecast { display: table; width: 100%; table-layout: fixed; }
    .forecast-day { display: table-cell; text-align: center; padding: 0.3vmin 0; }
    .forecast-name { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-light); }
    .forecast-icon { font-size: 1.15rem; margin: 0.3vmin 0; }
    .forecast-temps { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }

    /* Netatmo — moduly vedle sebe */
    .nm-wrap { display: table; width: 100%; border-spacing: 0.8vmin 0; margin: 0 -0.8vmin; }
    .nm-module { display: table-cell; width: 50%; background: var(--paper-dark); padding: 0.9vmin 1.1vmin; vertical-align: top; }
    .nm-name { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-light); }
    .nm-temp { font-family: 'JetBrains Mono', monospace; font-size: 1.9rem; font-weight: 500; margin: 0.2vmin 0; font-variant-numeric: tabular-nums; }
    .nm-row { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--ink-mid); display: table; width: 100%; }
    .nm-key { display: table-cell; color: var(--ink-light); }
    .nm-val { display: table-cell; text-align: right; }

    /* Tuya */
    .gate-row { margin-bottom: 0.7vmin; }
    .gate-ind { display: inline-block; width: 0.65rem; height: 0.65rem; border-radius: 50%; margin-right: 0.6rem; vertical-align: baseline; }
    .gate-ind.open { background: #b3261e; }
    .gate-ind.closed { background: #3a7d44; }
    .gate-ind.unknown { background: var(--ink-faint); }
    .gate-text { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 500; }
    .gate-name { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--ink-light); display: inline; margin-left: 0.6rem; }

    /* Growatt */
    .gw-main { margin-bottom: 0.8vmin; }
    .gw-power { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 500; line-height: 1; display: inline-block; font-variant-numeric: tabular-nums; }
    .gw-power-label { font-style: italic; color: var(--ink-mid); font-size: 0.84rem; margin-left: 0.6rem; }
    .gw-grid { display: table; width: 100%; border-spacing: 0.8vmin; margin: 0 -0.8vmin; }
    .gw-grid-row { display: table-row; }
    .gw-cell { display: table-cell; width: 50%; background: var(--paper-dark); padding: 0.8vmin 1vmin; vertical-align: top; }
    .gw-cell-label { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-light); margin-bottom: 0.2vmin; }
    .gw-cell-val { font-family: 'JetBrains Mono', monospace; font-size: 0.98rem; }
    .gw-cell-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--ink-light); margin-top: 0.2vmin; }
    .batt-wrap { height: 0.3rem; background: var(--paper); margin: 0.4vmin 0 0.3vmin; }
    .batt-fill { height: 100%; background: var(--ink-mid); }

    /* Graf (SOC / hluk) */
    .graph-label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--ink-light); margin: 0.8vmin 0 0.3vmin;
    }
    .graph-range { color: var(--ink); float: right; }
    .graph-svg { width: 100%; overflow: visible; display: block; }

    /* Kalendář / akce / jídelníček */
    .ev-row { display: table; width: 100%; margin-bottom: 0.5vmin; }
    .ev-date { display: table-cell; width: 4.6rem; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); white-space: nowrap; vertical-align: top; padding-top: 0.15rem; }
    .ev-title { display: table-cell; font-size: 0.88rem; }
    .ev-loc { font-size: 0.72rem; color: var(--ink-light); font-style: italic; }
    .menu-day-name { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-light); margin-bottom: 0.4vmin; }
    .menu-meal { font-size: 0.86rem; margin-bottom: 0.25vmin; }

    /* Microsoft To Do */
    .todo-row { display: table; width: 100%; margin-bottom: 0.5vmin; }
    .todo-due { display: table-cell; width: 3.4rem; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--ink-light); white-space: nowrap; vertical-align: top; padding-top: 0.15rem; }
    .todo-due.overdue { color: #b3261e; }
    .todo-title { display: table-cell; font-size: 0.88rem; vertical-align: top; }
    .todo-row.important .todo-title { font-weight: 700; }
  </style>
</head>
<body>

  <header class="topbar">
    <span id="clock">--:--</span>
    <span id="datum">&nbsp;</span>
  </header>

  <main>
    <section class="area-weather">
      <div class="section-label">Počasí — Vranov u Brna</div>
      <div id="weather-content" class="content"><div class="notice">načítám…</div></div>
    </section>

    <section class="area-netatmo">
      <div class="section-label">Doma — Netatmo</div>
      <div id="netatmo-content" class="content"><div class="notice">načítám…</div></div>
    </section>

    <section class="area-growatt">
      <div class="section-label">Fotovoltaika</div>
      <div id="growatt-content" class="content"><div class="notice">načítám…</div></div>
    </section>

    <div class="cell-stack area-cal">
      <section>
        <div class="section-label">Kalendář</div>
        <div id="cal-content" class="content"><div class="notice">načítám…</div></div>
      </section>
      <section>
        <div class="section-label">Microsoft To Do</div>
        <div id="mstodo-content" class="content"><div class="notice">načítám…</div></div>
      </section>
    </div>

    <div class="cell-stack area-mid">
      <section>
        <div class="section-label">Jídelníček MŠ</div>
        <div id="menu-content" class="content"><div class="notice">načítám…</div></div>
      </section>
      <section>
        <div class="section-label">Brána a garáž</div>
        <div id="tuya-content" class="content"><div class="notice">načítám…</div></div>
      </section>
    </div>

    <section class="area-zs">
      <div class="section-label">Plán akcí ZŠ</div>
      <div id="zs-content" class="content"><div class="notice">načítám…</div></div>
    </section>
  </main>

<script>
// Kiosk pro Safari 12 (iPad Air 1): bez ?. a ??, bez Promise.allSettled,
// bez flex gap. Data výhradně z větve data (Open-Meteo blokuje některé ISP).
// GitHub Pages (*.github.io) → veřejné raw; Cloudflare (vlastní doména) →
// same-origin Pages Function /api/data/ (privátní data za Access). Viz CLOUDFLARE.md.
var DATA_BRANCH_BASE = location.hostname.indexOf('github.io') !== -1
  ? 'https://raw.githubusercontent.com/MichalProuza/home_dashboard/data/'
  : '/api/data/';

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fetchJson(url) {
  return fetch(url, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

function fetchDataJson(name) {
  return fetchJson(DATA_BRANCH_BASE + name + '?t=' + Date.now())
    .catch(function () { return fetchJson('./data/' + name + '?t=' + Date.now()); });
}

// Safari 12 neumí ISO datum s mikrosekundami → ořež na milisekundy
function safeDate(iso) {
  if (!iso) return null;
  var d = new Date(String(iso).replace(/\.(\d{3})\d+/, '.$1'));
  return isNaN(d.getTime()) ? null : d;
}

function fmtTime(iso) {
  var d = safeDate(iso);
  return d ? d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) : '–';
}

// Lokální půlnoc z "YYYY-MM-DD" (Date.parse by vrátil UTC)
function localDate(ymd) {
  var p = String(ymd || '').split('-');
  if (p.length !== 3) return null;
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

// ── Hodiny ───────────────────────────────────────────────
var CZ_DAYS = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
var CZ_MONTHS = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
var DAY_ABBR = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('datum').textContent =
    CZ_DAYS[now.getDay()] + ' ' + now.getDate() + '. ' + CZ_MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  // Noční ztmavení 22–6 h (iOS 12 nemá časové automatizace Zkratek)
  var h = now.getHours();
  document.body.className = (h >= 22 || h < 6) ? 'night' : '';
}

// ── Počasí (weather.json z větve data) ───────────────────
var WMO = {0:'jasno',1:'skoro jasno',2:'polojasno',3:'zataženo',45:'mlha',48:'jinovatka',51:'slabé mrholení',53:'mrholení',55:'silné mrholení',56:'mrznoucí mrholení',57:'silné mrznoucí mrholení',61:'slabý déšť',63:'déšť',65:'silný déšť',66:'mrznoucí déšť',67:'silný mrznoucí déšť',71:'slabý sníh',73:'sníh',75:'silný sníh',77:'sněhová zrna',80:'přeháňky',81:'silné přeháňky',82:'přívalový déšť',85:'sněhové přeháňky',86:'silné sněhové přeháňky',95:'bouřka',96:'bouřka s krupobitím',99:'silná bouřka s krupobitím'};
var WMO_ICON = {0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',56:'🌧',57:'🌧',61:'🌧',63:'🌧',65:'🌧',66:'🌧',67:'🌧',71:'🌨',73:'❄️',75:'❄️',77:'🌨',80:'🌦',81:'🌧',82:'🌧',85:'🌨',86:'❄️',95:'⛈',96:'⛈',99:'⛈'};

// Předpověď na 10:00 a 14:00 — do 14:00 pro dnešek, po 14:01 pro zítřek
function getHoursForecast(hourly) {
  if (!hourly || !hourly.time || !hourly.temperature_2m) return null;
  var now = new Date();
  var tomorrow = (now.getHours() * 60 + now.getMinutes()) >= 14 * 60 + 1;
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (tomorrow ? 1 : 0));
  var ymd = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  function tempAt(hh) {
    var idx = hourly.time.indexOf(ymd + 'T' + hh + ':00');
    return idx === -1 ? null : hourly.temperature_2m[idx];
  }
  var t10 = tempAt('10'), t14 = tempAt('14');
  if (t10 === null && t14 === null) return null;
  return { label: tomorrow ? 'zítra' : 'dnes', t10: t10, t14: t14 };
}

// Předpokládané srážky za dalších 8 a 24 h (součet hodinové předpovědi od aktuální hodiny)
function getRainForecast(hourly) {
  if (!hourly || !hourly.time || !hourly.precipitation) return null;
  var now = new Date();
  var key = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-'
    + ('0' + now.getDate()).slice(-2) + 'T' + ('0' + now.getHours()).slice(-2) + ':00';
  var idx = hourly.time.indexOf(key);
  if (idx === -1) return null;
  function sum(n) {
    var s = 0;
    for (var i = idx; i < idx + n && i < hourly.precipitation.length; i++) s += Number(hourly.precipitation[i]) || 0;
    return s;
  }
  return { h8: sum(8), h24: sum(24) };
}

function fetchWeather() {
  var el = document.getElementById('weather-content');
  return fetchDataJson('weather.json').then(function (w) {
    var c = w.current, d = w.daily;
    if (!c || !d) throw new Error(w.error || 'bez dat');
    function trioCell(label, temp, cls) {
      return '<div class="w-cell"><div class="w-cell-label">' + label + '</div>'
        + '<div class="w-cell-temp' + (cls || '') + '">' + (temp === null ? '–' : Math.round(temp) + '°') + '</div></div>';
    }
    var hrs = getHoursForecast(w.hourly);
    var html = '<div class="w-trio">' + trioCell('teď', c.temperature_2m, ' now');
    if (hrs) {
      html += trioCell(hrs.label + ' 10:00', hrs.t10) + trioCell(hrs.label + ' 14:00', hrs.t14);
    }
    html += '</div>'
      + '<div class="w-cond">' + esc(WMO[c.weather_code] || '–')
      + ' · 💨 ' + Math.round(c.wind_speed_10m) + ' km/h · 💧 ' + esc(c.relative_humidity_2m) + ' %</div>';
    var rf = getRainForecast(w.hourly);
    if (rf) {
      html += '<div class="w-cond">☔ srážky · 8h ' + rf.h8.toFixed(1) + ' mm · 24h ' + rf.h24.toFixed(1) + ' mm</div>';
    }
    html += '<div class="forecast">';
    var times = d.time || [];
    for (var i = 0; i < Math.min(5, times.length); i++) {
      var dn = localDate(times[i]);
      var name = i === 0 ? 'Dnes' : i === 1 ? 'Zítra' : (dn ? DAY_ABBR[dn.getDay()] : '–');
      html += '<div class="forecast-day"><div class="forecast-name">' + esc(name) + '</div>'
        + '<div class="forecast-icon">' + (WMO_ICON[d.weather_code[i]] || '–') + '</div>'
        + '<div class="forecast-temps">' + Math.round(d.temperature_2m_max[i]) + '° / ' + Math.round(d.temperature_2m_min[i]) + '°</div></div>';
    }
    html += '</div><div class="updated">data z ' + fmtTime(w.updated) + '</div>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání počasí</div>';
  });
}

// ── Netatmo ──────────────────────────────────────────────
var NLABELS = {Humidity:'Vlhkost', CO2:'CO₂', Noise:'Hluk', Pressure:'Tlak'};
var NUNITS  = {Humidity:' %', CO2:' ppm', Noise:' dB', Pressure:' hPa'};

function fetchNetatmo() {
  var el = document.getElementById('netatmo-content');
  return fetchDataJson('netatmo.json').then(function (data) {
    var modules = data.modules || [];
    if (data.error || !modules.length) throw new Error(data.error || 'bez dat');
    var html = '<div class="nm-wrap">';
    modules.forEach(function (mod) {
      var dd = mod.data || {};
      html += '<div class="nm-module"><div class="nm-name">' + esc(mod.name) + '</div>';
      if (dd.Temperature !== undefined) {
        html += '<div class="nm-temp">' + Number(dd.Temperature).toFixed(1) + '°C</div>';
      }
      ['Humidity', 'CO2', 'Noise', 'Pressure'].forEach(function (k) {
        if (dd[k] === undefined || dd[k] === null) return;
        html += '<div class="nm-row"><span class="nm-key">' + NLABELS[k] + '</span>'
          + '<span class="nm-val">' + Math.round(Number(dd[k])) + NUNITS[k] + '</span></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    if (data.noise && data.noise.length > 1) html += renderHistoryGraph(data.noise, 'Hluk / 24h', 'dB');
    html += '<div class="updated">data z ' + fmtTime(data.updated) + '</div>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání Netatmo</div>';
  });
}

// ── Sdílený 24h graf ─────────────────────────────────────
function renderHistoryGraph(points, label, unit) {
  if (points.length < 2) return '';
  var W = 400, H = 42;
  var minV = Infinity, maxV = -Infinity;
  points.forEach(function (p) { if (p.v < minV) minV = p.v; if (p.v > maxV) maxV = p.v; });
  var range = (maxV - minV) || 1;
  var tMin = points[0].t, tMax = points[points.length - 1].t;
  var tRange = (tMax - tMin) || 1;
  function px(t) { return ((t - tMin) / tRange) * W; }
  function py(v) { return H - 2 - ((v - minV) / range) * (H - 6); }
  var linePath = points.map(function (p, i) {
    return (i === 0 ? 'M ' : 'L ') + px(p.t).toFixed(1) + ' ' + py(p.v).toFixed(1);
  }).join(' ');
  var areaPath = linePath + ' L ' + px(tMax).toFixed(1) + ' ' + H + ' L ' + px(tMin).toFixed(1) + ' ' + H + ' Z';
  var labels = '';
  var step6h = 6 * 3600;
  for (var t = Math.ceil(tMin / step6h) * step6h; t <= tMax; t += step6h) {
    var hh = ('0' + new Date(t * 1000).getHours()).slice(-2);
    labels += '<text x="' + px(t).toFixed(1) + '" y="' + (H + 11) + '" font-size="8" fill="var(--ink-faint)" text-anchor="middle" font-family="JetBrains Mono, monospace">' + hh + ':00</text>';
  }
  return '<div><div class="graph-label">' + esc(label)
    + '<span class="graph-range">' + Math.round(minV) + '–' + Math.round(maxV) + ' ' + esc(unit) + '</span></div>'
    + '<svg viewBox="0 0 ' + W + ' ' + (H + 14) + '" class="graph-svg">'
    + '<path d="' + areaPath + '" fill="var(--paper-dark)" stroke="none"/>'
    + '<path d="' + linePath + '" fill="none" stroke="var(--ink-mid)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + labels + '</svg></div>';
}

// ── Growatt ──────────────────────────────────────────────
function fetchGrowatt() {
  var el = document.getElementById('growatt-content');
  return fetchDataJson('growatt.json').then(function (data) {
    var plants = data.plants || [];
    if (data.error || !plants.length) throw new Error(data.error || 'bez dat');
    var dev = (plants[0].devices || [])[0] || {};
    function num(v) { return typeof v === 'number' ? v : 0; }
    function fmtW(w) {
      w = Math.abs(w);
      return w >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W';
    }
    var battPct = num(dev.battery_pct), battW = num(dev.battery_w);
    var html = '<div class="gw-main"><span class="gw-power">' + fmtW(num(dev.solar_w)) + '</span>'
      + '<span class="gw-power-label">aktuální výkon</span></div>'
      + '<div class="gw-grid"><div class="gw-grid-row">'
      + '<div class="gw-cell"><div class="gw-cell-label">Baterie</div>'
      + '<div class="gw-cell-val">' + battPct.toFixed(0) + ' %</div>'
      + '<div class="batt-wrap"><div class="batt-fill" style="width:' + Math.min(100, Math.max(0, battPct)) + '%"></div></div>'
      + '<div class="gw-cell-sub">' + (battW > 0 ? '+' : '') + Math.round(battW) + ' W</div></div>'
      + '<div class="gw-cell"><div class="gw-cell-label">Síť · ' + (dev.grid_direction === 'export' ? '↑ export' : '↓ import') + '</div>'
      + '<div class="gw-cell-val">' + fmtW(num(dev.grid_w)) + '</div>'
      + '<div class="gw-cell-sub">↑ ' + num(dev.today_export_kwh).toFixed(1) + ' / ↓ ' + num(dev.today_import_kwh).toFixed(1) + ' kWh dnes</div></div>'
      + '</div><div class="gw-grid-row">'
      + '<div class="gw-cell"><div class="gw-cell-label">Spotřeba</div>'
      + '<div class="gw-cell-val">' + fmtW(num(dev.load_w)) + '</div></div>'
      + '<div class="gw-cell"><div class="gw-cell-label">Výroba dnes</div>'
      + '<div class="gw-cell-val">' + num(dev.today_kwh).toFixed(2) + ' kWh</div>'
      + '<div class="gw-cell-sub">celkem ' + num(dev.total_kwh).toFixed(0) + ' kWh</div></div>'
      + '</div></div>';
    if (data.soc && data.soc.length > 1) html += renderHistoryGraph(data.soc, 'Baterie / 24h', '%');
    html += '<div class="updated">data z ' + fmtTime(data.updated) + '</div>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání Growatt</div>';
  });
}

// ── Tuya (brána, garáž) ──────────────────────────────────
function fetchTuya() {
  var el = document.getElementById('tuya-content');
  return fetchDataJson('tuya.json').then(function (data) {
    var devices = data.devices || [];
    if (data.error || !devices.length) throw new Error(data.error || 'bez dat');
    var html = '';
    devices.forEach(function (dev) {
      var cls = dev.gate_open === true ? 'open' : dev.gate_open === false ? 'closed' : 'unknown';
      var txt = dev.gate_open === true ? 'OTEVŘENO' : dev.gate_open === false ? 'ZAVŘENO' : 'neznámo';
      html += '<div class="gate-row"><span class="gate-ind ' + cls + '"></span>'
        + '<span class="gate-text">' + txt + '</span>'
        + '<span class="gate-name">' + esc(dev.device_name || '–') + (dev.online === false ? ' · offline' : '') + '</span></div>';
    });
    html += '<div class="updated">data z ' + fmtTime(data.updated) + '</div>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání senzorů</div>';
  });
}

// ── Kalendář ─────────────────────────────────────────────
function fetchCalendar() {
  var el = document.getElementById('cal-content');
  return fetchDataJson('calendar.json').then(function (data) {
    var events = (data.recurring || []).concat(data.single || []);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    // Datum je "YYYY-MM-DD" (celodenní), nebo plné ISO s časem a offsetem
    var items = events.map(function (ev) {
      var s = String(ev.date || '');
      var dt = s.indexOf('T') !== -1 ? safeDate(s) : localDate(s);
      return { ev: ev, dt: dt, timed: !ev.all_day && s.indexOf('T') !== -1 };
    }).filter(function (x) {
      return x.dt && x.dt.getTime() >= today.getTime();
    }).sort(function (a, b) { return a.dt - b.dt; }).slice(0, 5);
    if (!items.length) { el.innerHTML = '<div class="notice">žádné nadcházející události</div>'; return; }
    var html = '';
    items.forEach(function (x) {
      var d = x.dt, ev = x.ev;
      var when = DAY_ABBR[d.getDay()] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
      if (x.timed) {
        when += '<br>' + d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
      }
      html += '<div class="ev-row"><div class="ev-date">' + when + '</div>'
        + '<div class="ev-title">' + esc(ev.summary)
        + (ev.location ? ' <span class="ev-loc">' + esc(ev.location) + '</span>' : '') + '</div></div>';
    });
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání kalendáře</div>';
  });
}

// ── Jídelníček MŠ (dnešní den) ───────────────────────────
function fetchSchoolMenu() {
  var el = document.getElementById('menu-content');
  return fetchDataJson('school_menu.json').then(function (data) {
    var keys = ['nedele', 'pondeli', 'utery', 'streda', 'ctvrtek', 'patek', 'sobota'];
    // Po 16:00 už ukaž zítřejší den (dnešní oběd je odbytý)
    var now = new Date();
    var idx = now.getDay() + (now.getHours() >= 16 ? 1 : 0);
    var day = (data.days || {})[keys[idx]];
    if (!day || !(day.meals || []).length) {
      el.innerHTML = '<div class="notice">dnes se nevaří</div>';
      return;
    }
    var html = '<div class="menu-day-name">' + esc(day.name) + (data.week ? ' · ' + esc(data.week) : '') + '</div>';
    day.meals.forEach(function (m) { html += '<div class="menu-meal">' + esc(m) + '</div>'; });
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání jídelníčku</div>';
  });
}

// ── Plán akcí ZŠ ─────────────────────────────────────────
function fetchZsCalendar() {
  var el = document.getElementById('zs-content');
  return fetchDataJson('school_calendar.json').then(function (data) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var events = (data.events || []).filter(function (ev) {
      var d = localDate(ev.date);
      return d && d.getTime() >= today.getTime();
    }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 6);
    if (!events.length) { el.innerHTML = '<div class="notice">žádné nadcházející akce</div>'; return; }
    var html = '';
    events.forEach(function (ev) {
      var d = localDate(ev.date);
      html += '<div class="ev-row"><div class="ev-date">' + DAY_ABBR[d.getDay()] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.'
        + (ev.time ? '<br>' + esc(ev.time) : '') + '</div>'
        + '<div class="ev-title">' + esc(ev.title)
        + (ev.location ? ' <span class="ev-loc">' + esc(ev.location) + '</span>' : '') + '</div></div>';
    });
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání akcí ZŠ</div>';
  });
}

// ── Microsoft To Do (mstodo.json z větve data) ───────────
function fetchMsTodo() {
  var el = document.getElementById('mstodo-content');
  return fetchDataJson('mstodo.json').then(function (data) {
    var tasks = data.tasks || [];
    if (data.error && !tasks.length) {
      el.innerHTML = '<div class="notice">úkoly se nepodařilo načíst</div>';
      return;
    }
    if (!tasks.length) {
      el.innerHTML = '<div class="notice">žádné úkoly</div>';
      return;
    }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    // S termínem (podle data) první, bez termínu na konec
    tasks = tasks.slice().sort(function (a, b) {
      if (a.due && b.due) return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
      if (a.due) return -1;
      if (b.due) return 1;
      return 0;
    }).slice(0, 5);
    var html = '';
    tasks.forEach(function (t) {
      var dueHtml = '', dueClass = 'todo-due';
      if (t.due) {
        var d = localDate(t.due);
        if (d) {
          if (d.getTime() < today.getTime()) dueClass += ' overdue';
          dueHtml = DAY_ABBR[d.getDay()] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
        }
      }
      html += '<div class="todo-row' + (t.important ? ' important' : '') + '">'
        + '<div class="' + dueClass + '">' + dueHtml + '</div>'
        + '<div class="todo-title">' + esc(t.title) + '</div></div>';
    });
    html += '<div class="updated">data z ' + fmtTime(data.updated) + '</div>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<div class="notice">chyba načítání úkolů</div>';
  });
}

// ── Spuštění ─────────────────────────────────────────────
function initAll() {
  var jobs = [fetchWeather, fetchNetatmo, fetchGrowatt, fetchTuya, fetchCalendar, fetchSchoolMenu, fetchZsCalendar, fetchMsTodo];
  return Promise.all(jobs.map(function (fn) {
    return fn().catch(function () {});
  }));
}

updateClock();
setInterval(updateClock, 1000);
initAll();
setInterval(initAll, 15 * 60 * 1000);
// Jednou za 12 h celé znovu načíst — starý Safari, ať se pročistí paměť
setTimeout(function () { location.reload(); }, 12 * 3600 * 1000);
</script>
