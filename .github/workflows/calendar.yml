name: Fetch Calendar

on:
  schedule:
    - cron: '0 * * * *'   # každou hodinu
  workflow_dispatch:        # možnost spustit ručně

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests icalendar recurring-ical-events

      - name: Fetch calendar
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python scripts/fetch_calendar.py

      - name: Publish data
        run: 'bash scripts/publish_data.sh "chore: update calendar" calendar.json'
