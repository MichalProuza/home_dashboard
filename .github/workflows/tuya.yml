name: Fetch Tuya Gate Status

on:
  workflow_dispatch:           # možnost spustit ručně
  schedule:
    - cron: '*/30 * * * *'     # každých 30 minut automaticky

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Tuya gate status
        env:
          TUYA_ACCESS_ID:     ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID:     ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_DEVICE_ID_2:   ${{ secrets.TUYA_DEVICE_ID_2 }}
          TUYA_DEVICE_ID_3:   ${{ secrets.TUYA_DEVICE_ID_3 }}
          TUYA_REGION:        ${{ secrets.TUYA_REGION }}
        run: python scripts/fetch_tuya.py

      - name: Publish data
        run: 'bash scripts/publish_data.sh "chore: update tuya gate status" tuya.json'
