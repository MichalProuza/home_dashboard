name: Fetch School Menu

on:
  schedule:
    - cron: '0 5 * * *'   # denně v 5:00 UTC (6:00 zimního / 7:00 letního času) – škola zveřejňuje jídelníček na nový týden už o víkendu
  workflow_dispatch:           # možnost spustit ručně

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch school menu
        run: python scripts/fetch_school_menu.py

      - name: Publish data
        run: 'bash scripts/publish_data.sh "chore: update school menu" school_menu.json'
