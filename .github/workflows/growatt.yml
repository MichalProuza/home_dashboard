name: Fetch Growatt Data

on:
  workflow_dispatch:           # možnost spustit ručně
  schedule:
    - cron: '*/15 4-19 * * *'      # přes den (cca 6–21 h místního času) každých 15 minut
    - cron: '0 0-3,20-23 * * *'    # v noci jen jednou za hodinu

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # growattServer >= 2.x používá syntaxi "type X = ..." (PEP 695) → nutný Python 3.12+
          python-version: '3.12'

      - name: Install dependencies
        # PyPI občas vrátí přechodné "versions: none" → opakovat s odstupem
        run: |
          for i in 1 2 3 4; do
            pip install growattServer && break
            echo "pip install selhal (pokus $i), čekám…"; sleep $((i*15))
          done
          python -c "import growattServer"

      - name: Fetch Growatt data
        env:
          GROWATT_USER: ${{ secrets.GROWATT_USER }}
          GROWATT_PASS: ${{ secrets.GROWATT_PASS }}
          GROWATT_API_TOKEN: ${{ secrets.GROWATT_API_TOKEN }}
        run: python scripts/diag_growatt_v1.py  # DOČASNĚ: diagnostika V1 API

      - name: Publish data
        run: 'bash scripts/publish_data.sh "chore: update growatt data" growatt.json'
