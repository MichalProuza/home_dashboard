name: Fetch Microsoft To Do

on:
  schedule:
    - cron: '*/30 * * * *'   # každých 30 minut
  workflow_dispatch:           # možnost spustit ručně

# Refresh token rotuje – dva běhy najednou by si ho navzájem zneplatnily
concurrency:
  group: mstodo-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Load stored refresh token
        run: |
          git fetch origin data 2>/dev/null || true
          git show origin/data:mstodo_token.enc > data/mstodo_token.enc 2>/dev/null || true

      - name: Fetch Microsoft To Do
        env:
          MSTODO_CLIENT_ID:     ${{ secrets.MSTODO_CLIENT_ID }}
          MSTODO_REFRESH_TOKEN: ${{ secrets.MSTODO_REFRESH_TOKEN }}
          MSTODO_TOKEN_KEY:     ${{ secrets.MSTODO_TOKEN_KEY }}
          MSTODO_TENANT:        ${{ secrets.MSTODO_TENANT }}
          MSTODO_LIST:          ${{ secrets.MSTODO_LIST }}
        run: python scripts/fetch_mstodo.py

      - name: Publish data
        run: 'bash scripts/publish_data.sh "chore: update mstodo data" mstodo.json mstodo_token.enc'
